<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Pet - PetCare AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7fbff;
            color: #17233c;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 235px;
            background: #ffffff;
            border-right: 1px solid #edf0f5;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            padding: 5px 12px 30px;
        }

        .logo-paw {
            font-size: 25px;
        }

        .logo span {
            color: #16a36a;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu a {
            text-decoration: none;
            color: #526078;
            padding: 12px 13px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: .2s;
        }

        .menu a:hover {
            background: #eefaf5;
            color: #129762;
        }

        .menu a.active {
            background: #dff5eb;
            color: #109460;
        }

        .menu-icon {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }

        .logout {
            margin-top: auto;
            text-decoration: none;
            color: #f04472;
            background: #fff0f4;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 235px;
            width: calc(100% - 235px);
            padding: 35px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #7d8798;
            font-size: 13px;
        }

        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            max-width: 750px;
            background: #ffffff;
            border: 1px solid #edf0f5;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 28px rgba(30, 45, 75, .06);
        }

        .pet-heading {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px;
            background: #effbf6;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .pet-heading-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #dff5eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .pet-heading h2 {
            font-size: 16px;
            color: #295641;
            margin-bottom: 4px;
        }

        .pet-heading p {
            font-size: 11px;
            color: #7d8798;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #3f4c62;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 42px;
            border: 1px solid #e1e6ed;
            border-radius: 10px;
            outline: none;
            padding: 0 12px;
            color: #38445a;
            background: white;
            font-size: 12px;
        }

        input:focus,
        select:focus {
            border-color: #20a86c;
            box-shadow: 0 0 0 3px rgba(32,168,108,.08);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-btn,
        .cancel-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #19a66a;
            color: white;
            flex: 1;
        }

        .save-btn:hover {
            background: #128b58;
        }

        .cancel-btn {
            background: #f1f3f6;
            color: #667287;
        }

        .cancel-btn:hover {
            background: #e4e7eb;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 750px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .layout {
                flex-direction: column;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .menu {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .logout {
                margin-top: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-paw">🐾</div>

            <div>
                PetCare <span>AI</span>
            </div>
        </div>

        <nav class="menu">

            <a href="/dashboard">
                <span class="menu-icon">⌂</span>
                Dashboard
            </a>

            <a href="/pets" class="active">
                <span class="menu-icon">🐾</span>
                My Pets
            </a>

            <a href="/vaccination">
                <span class="menu-icon">💉</span>
                Vaccination
            </a>

            <a href="/health-records">
                <span class="menu-icon">📋</span>
                Health Records
            </a>

            <a href="/ai-health">
                <span class="menu-icon">🤖</span>
                AI Health Checker
            </a>

            <a href="/nearby-vet">
                <span class="menu-icon">📍</span>
                Nearby Veterinarians
            </a>

            <a href="/notifications">
                <span class="menu-icon">🔔</span>
                Notifications
            </a>

            <a href="/profile">
                <span class="menu-icon">👤</span>
                Profile
            </a>

        </nav>

        <a href="/logout" class="logout">
            ⇥ &nbsp; Logout
        </a>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="page-header">

            <h1>✏️ Edit Pet</h1>

            <p>
                Update your pet's profile information.
            </p>

        </div>


        <div class="form-card">

            <div class="pet-heading">

                <div class="pet-heading-icon">
                    🐾
                </div>

                <div>
                    <h2>
                        {{ pet.pet_name }}
                    </h2>

                    <p>
                        Edit your pet details below
                    </p>
                </div>

            </div>


            <form method="POST">

                <div class="form-grid">

                    <!-- PET NAME -->

                    <div class="input-group">

                        <label>
                            Pet Name
                        </label>

                        <input
                            type="text"
                            name="pet_name"
                            value="{{ pet.pet_name }}"
                            required
                        >

                    </div>


                    <!-- PET TYPE -->

                    <div class="input-group">

                        <label>
                            Pet Type
                        </label>

                        <select
                            name="pet_type"
                            required
                        >

                            <option
                                value="Dog"
                                {% if pet.pet_type|lower == "dog" %}selected{% endif %}
                            >
                                Dog
                            </option>

                            <option
                                value="Cat"
                                {% if pet.pet_type|lower == "cat" %}selected{% endif %}
                            >
                                Cat
                            </option>

                            <option
                                value="Bird"
                                {% if pet.pet_type|lower == "bird" %}selected{% endif %}
                            >
                                Bird
                            </option>

                            <option
                                value="Rabbit"
                                {% if pet.pet_type|lower == "rabbit" %}selected{% endif %}
                            >
                                Rabbit
                            </option>

                            <option
                                value="Other"
                                {% if pet.pet_type|lower == "other" %}selected{% endif %}
                            >
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- BREED -->

                    <div class="input-group">

                        <label>
                            Breed
                        </label>

                        <input
                            type="text"
                            name="breed"
                            value="{{ pet.breed or '' }}"
                            placeholder="Enter breed"
                        >

                    </div>


                    <!-- AGE -->

                    <div class="input-group">

                        <label>
                            Age (Years)
                        </label>

                        <input
                            type="number"
                            name="age"
                            min="0"
                            value="{{ pet.age or '' }}"
                            placeholder="Enter age"
                        >

                    </div>


                    <!-- WEIGHT -->

                    <div class="input-group">

                        <label>
                            Weight (kg)
                        </label>

                        <input
                            type="number"
                            name="weight"
                            min="0"
                            step="0.01"
                            value="{{ pet.weight or '' }}"
                            placeholder="Enter weight"
                        >

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        💾 Save Changes
                    </button>

                    <a
                        href="{{ url_for('my_pets') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
