<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - PetCare AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f9fc;
            color: #18324a;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #71808c;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccd6df;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1677c8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1265a8;
        }

        .message {
            color: #d9534f;
            text-align: center;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1677c8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">👨‍💻</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            PetCare AI Administration Panel
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>
        
<a href="{{ url_for('home') }}" class="back">
    ← Back to Home
</a>

    </div>

</div>

</body>
</html>
